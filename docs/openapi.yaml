openapi: 3.0.0
info:
  title: Mobile Auth API
  version: 1.0.0
  description: Production-grade authentication API.

servers:
  - url: http://localhost:3000
    description: Development server

tags:
  - name: Auth
    description: Authentication, registration, and OTP verification endpoints
  - name: Users
    description: User resource management and account lifecycle endpoints

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter your JWT token in the format `Bearer <token>`

paths:
  # --- Auth Domain --- (from docs/paths/auth.yaml)
  /api/auth/register:
    $ref: './paths/auth.yaml#/paths/~1api~1auth~1register'

  /api/auth/login:
    $ref: './paths/auth.yaml#/paths/~1api~1auth~1login'

  /api/auth/verify-otp:
    $ref: './paths/auth.yaml#/paths/~1api~1auth~1verify-otp'

  # --- User Resource Domain -- (from docs/paths/users.yaml)
  /api/users/me:
    $ref: './paths/users.yaml#/paths/~1api~1users~1me'